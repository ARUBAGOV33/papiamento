name: Gauntlet

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gauntlet:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate data
        run: python3 tools/validate.py

      - name: Progress pages up to date
        # Not blocking: the "Refresh progress pages" workflow rebuilds them on
        # main after the merge, so a contributor who edits a file in the
        # browser does not have to run the tool.
        run: python3 tools/build_pages.py --check || echo "::notice::Progress pages are out of date; they are rebuilt automatically after the merge."

      - name: Rule tests in JavaScript
        run: node tools/test_rules.mjs

      - name: Contribution tool checks match the rules
        # tools/contribute/data/checks.js is a generated copy of rules/,
        # barbarismos and variants. Without this step a stale copy only
        # fails the "Contribution site" deploy after the merge (PR #30).
        run: node tools/contribute/test_checker.mjs || { echo "::error::tools/contribute/data/checks.js is out of date. Run python3 tools/contribute/build_sample.py and commit tools/contribute/data/."; exit 1; }

      - name: Release files build
        run: python3 tools/build_dist.py --check

      - name: JSON report
        if: always()
        run: python3 tools/validate.py --json > gauntlet.json || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gauntlet-${{ matrix.python-version }}
          path: gauntlet.json
          if-no-files-found: ignore
