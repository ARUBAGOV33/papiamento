name: Contribution site

# Builds the contribution tool (tools/contribute/) and publishes it with
# GitHub Pages at https://arubagov33.github.io/papiamento/.
#
# It runs on every push to main that changes the tool or the data it shows,
# and by hand. Needs (DESIGN.md §11): Pages source "GitHub Actions", and the
# repository variables SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY. Both are
# public by design: the database's access rules decide what they can reach
# (tools/contribute/supabase/README.md). build_site.py refuses a secret key.

on:
  push:
    branches: [main]
    paths:
      - 'tools/contribute/**'
      - 'tools/word_frequency.py'
      - 'lexicon/words/**'
      - 'lexicon/barbarismos/**'
      - 'lexicon/variants/**'
      - 'corpus/parallel/**'
      - 'eval/parallel/**'
      - 'rules/**'
      - 'grammar/**'
      - '.github/workflows/contribute-site.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Install PyMuPDF and Pillow
        run: python3 -m pip install --quiet pymupdf==1.28.2 pillow==12.3.0

      - name: Check the live checks
        run: node tools/contribute/test_checker.mjs

      - name: Build the site
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: python3 tools/contribute/build_site.py --out _site --live --vendor

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
