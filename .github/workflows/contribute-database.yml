name: Contribution database check

# Three times a week, or by hand: check that the contribution tool's database
# (Supabase) is up. A paused project loses its address, so the website still
# loads but nobody can sign in. A failed run is the alarm: GitHub emails the
# person who last changed the schedule below.
#
# Needs: variable SUPABASE_URL and secret SUPABASE_SECRET_KEY, as the sync does.
# It reads at most one row id and changes nothing.

on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1,3,5'   # Mondays, Wednesdays and Fridays 07:23 UTC
  push:
    branches: [main]
    paths:
      - 'tools/contribute/supabase/check_database_up.mjs'
      - '.github/workflows/contribute-database.yml'

permissions:
  contents: read

jobs:
  database-up:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check that the database answers
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node tools/contribute/supabase/check_database_up.mjs
